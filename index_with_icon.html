  localStorage.setItem(KEY,JSON.stringify(words));
}
let stats=JSON.parse(localStorage.getItem(STAT)||'{"right":0,"total":0}');
let current=null,locked=false;
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(words));localStorage.setItem(STAT,JSON.stringify(stats));update()}
function update(){$("count").textContent=words.length;$("rate").textContent=stats.total?Math.round(stats.right/stats.total*100)+"%":"—"}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function quiz(){
locked=false;$("feedback").classList.add("hidden");$("next").classList.add("hidden");
if(!words.length){$("quizContent").classList.add("hidden");$("emptyQuiz").classList.remove("hidden");return}
$("quizContent").classList.remove("hidden");$("emptyQuiz").classList.add("hidden");
current=words[Math.floor(Math.random()*words.length)];$("qword").textContent=current.ru;
let opts=shuffle([current.ja,...shuffle(words.filter(w=>w!==current)).slice(0,3).map(w=>w.ja)]);
const fillers=["理解する","決める","避ける","見つける","忘れる","覚えている"].filter(x=>!opts.includes(x));
while(opts.length<4)opts.push(fillers.shift());
opts=shuffle(opts.slice(0,4));$("choices").innerHTML="";
opts.forEach(t=>{let b=document.createElement("button");b.className="btn choice";b.textContent=t;b.onclick=()=>answer(b,t);$("choices").appendChild(b)});
$("num").textContent=(stats.total+1)+"問目";
}

async function sendQuizNotification(){
  const status=$("notifyStatus");
  if(!("Notification" in window)){
    status.textContent="このiPhone/ブラウザでは通知に対応していません。";
    return;
  }
  try{
    let perm=Notification.permission;
    if(perm==="default") perm=await Notification.requestPermission();
    if(perm!=="granted"){
      status.textContent="通知が許可されていません。iPhoneの設定で「露単語クイズ」の通知を許可してください。";
      return;
    }
    if(!words.length){
      status.textContent="単語を1つ以上登録してね。";
      return;
    }
    const q=words[Math.floor(Math.random()*words.length)];
    const opts=shuffle([q.ja,...shuffle(words.filter(w=>w!==q)).slice(0,2).map(w=>w.ja),
      "理解する","決める","避ける","見つける"].filter((x,i,a)=>a.indexOf(x)===i)).slice(0,3);
    while(opts.length<3) opts.push(["忘れる","覚えている","必ず"][opts.length-1]);
    const text=`意味は？ ① ${opts[0]}　② ${opts[1]}　③ ${opts[2]}`;
    const n=new Notification("🇷🇺 露単語クイズ：今日の1問",{body:`${q.ru}\n${text}`,tag:"ru-quiz-one",renotify:true});
    n.onclick=()=>{window.focus();n.close();};
    status.textContent="通知を送りました！ロック画面／通知センターから確認できます。";
  }catch(e){
    status.textContent="通知を送れませんでした。ホーム画面の「露単語クイズ」からもう一度試してね。";
  }
}

function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function startEdit(id){
  const w=words.find(x=>String(x.id)===String(id));
  if(!w)return;
  const area=$("editArea");
  area.classList.remove("hidden");
  area.innerHTML=`
    <h3>単語を編集</h3>
    <label>ロシア語<input id="editRu" value="${escapeHtml(w.ru)}"></label>
    <label>日本語の意味<input id="editJa" value="${escapeHtml(w.ja)}"></label>
    <label>例文<input id="editExample" value="${escapeHtml(w.example||"")}"></label>
    <label>メモ<input id="editNote" value="${escapeHtml(w.note||"")}"></label>
    <div class="row">
      <button class="btn" id="saveEdit">保存</button>
      <button class="btn secondary" id="cancelEdit">キャンセル</button>
    </div>`;
  $("saveEdit").onclick=()=>{
    w.ru=$("editRu").value.trim();
    w.ja=$("editJa").value.trim()||"意味未登録";
    w.example=$("editExample").value.trim();
    w.note=$("editNote").value.trim();
    saveWords(); renderWords(); area.classList.add("hidden"); area.innerHTML="";
  };
  $("cancelEdit").onclick=()=>{area.classList.add("hidden");area.innerHTML="";};
}
function deleteWord(id){
  const w=words.find(x=>String(x.id)===String(id));
  if(!w)return;
  if(!confirm(`「${w.ru}」を削除しますか？`))return;
  words=words.filter(x=>String(x.id)!==String(id));
  saveWords(); renderWords();
}
function answer(btn,text){if(locked)return;locked=true;const ok=text===current.ja;stats.total++;if(ok)stats.right++;
document.querySelectorAll("#choices .choice").forEach(b=>{if(b.textContent===current.ja)b.classList.add("ok");else if(b===btn)b.classList.add("no")});
$("feedback").innerHTML=(ok?"✓ 正解！":"✕ 正解は「"+esc(current.ja)+"」")+(current.ex?'<div class="muted" style="margin-top:8px">例文：'+esc(current.ex)+'</div>':'')+(current.note?'<div class="muted">メモ：'+esc(current.note)+'</div>':'');
$("feedback").classList.remove("hidden");$("next").classList.remove("hidden");save()}
$("next").onclick=quiz;
function tab(name){document.querySelectorAll(".page").forEach(p=>p.classList.toggle("hidden",p.id!==name));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));if(name==="quiz")quiz();if(name==="list")render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.tab));
$("notifyBtn").onclick=sendQuizNotification;
$("save").onclick=()=>{let ru=$("ru").value.trim(),ja=$("ja").value.trim();if(!ru||!ja){$("saved").textContent="ロシア語と意味を入力してね。";return}words.push({ru,ja,ex:$("ex").value.trim(),note:$("note").value.trim()});$("ru").value=$("ja").value=$("ex").value=$("note").value="";$("saved").textContent="登録しました！";save()};
function render(){
  const box=$("items");
  const q=(($("searchInput")?.value)||"").trim().toLowerCase();
  const filtered=words.filter(w=>{
    const hay=[w.ru,w.ja,w.ex,w.example,w.note,w.explanation].join(" ").toLowerCase();
    return !q || hay.includes(q);
  });
  $("listCount").textContent=(q?filtered.length+" / ":"")+words.length+"語";
  $("searchCount").textContent=q?`（「${q}」の検索結果）`:"";
  box.innerHTML="";
  if(!filtered.length){
    box.innerHTML="<div class='empty'>該当する単語がありません。</div>";
    return;
  }
  filtered.forEach(w=>{
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`<div class="row">
      <strong>${esc(w.ru||"")}</strong>
      <div class="word-actions">
        <button class="btn smallbtn editWord">編集</button>
        <button class="btn smallbtn deleteWord">削除</button>
      </div>
    </div>
    <div>${esc(w.ja||"意味未登録")}</div>
    ${(w.note?`<div class="muted">${esc(w.note)}</div>`:"")}
    ${(w.ex?`<div class="muted">${esc(w.ex)}</div>`:"")}`;
    d.querySelector(".editWord").onclick=()=>startEdit(w);
    d.querySelector(".deleteWord").onclick=()=>{
      if(confirm(`「${w.ru}」を削除しますか？`)){
        words=words.filter(x=>x!==w);
        save();
        render();
      }
    };
    box.appendChild(d);
  });
}
function startEdit(w){
  const area=$("editArea");
  area.classList.remove("hidden");
  area.innerHTML=`<h3>単語を編集</h3>
    <label>ロシア語<input id="editRu" value="${esc(w.ru||"")}"></label>
    <label>日本語の意味<input id="editJa" value="${esc(w.ja||"")}"></label>
    <label>例文<input id="editEx" value="${esc(w.ex||"")}"></label>
    <label>メモ<input id="editNote" value="${esc(w.note||"")}"></label>
    <div class="row">
      <button class="btn" id="saveEdit">保存</button>
      <button class="btn secondary" id="cancelEdit">キャンセル</button>
    </div>`;
  $("saveEdit").onclick=()=>{
    w.ru=$("editRu").value.trim();
    w.ja=$("editJa").value.trim()||"意味未登録";
    w.ex=$("editEx").value.trim();
    w.note=$("editNote").value.trim();
    save(); render();
    area.classList.add("hidden"); area.innerHTML="";
  };
  $("cancelEdit").onclick=()=>{area.classList.add("hidden");area.innerHTML="";};
}

$("searchInput")?.addEventListener("input",render);
$("clearSearchBtn")?.addEventListener("click",()=>{ $("searchInput").value=""; render(); });
update();quiz();
})();

</script>
</body>
</html>
