<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="露単語クイズ">
<title>露単語クイズ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#171717;background:#f5f5f7}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:680px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:24px;font-weight:800}.stats{display:flex;gap:8px}.stat{background:#fff;border:1px solid #ddd;border-radius:12px;padding:7px 10px;font-size:12px}.stat b{font-size:16px;display:block}
nav{display:flex;gap:8px;margin-bottom:12px;overflow:auto}nav button,.btn{border:1px solid #ddd;background:#fff;border-radius:12px;padding:11px 14px;font-weight:700;font-size:15px;min-height:44px}nav button.active,.primary{background:#171717;color:white;border-color:#171717}
.card{background:#fff;border:1px solid #ddd;border-radius:22px;padding:22px}.muted{color:#777;font-size:13px}.word{font-size:clamp(38px,10vw,64px);font-weight:850;margin:25px 0 4px;word-break:break-word}.meaning{font-size:21px}.choices{display:grid;gap:9px;margin-top:20px}.choice{text-align:left;width:100%;min-height:52px}.choice.ok{background:#e7f6eb;border-color:#72b982}.choice.no{background:#fbe9e9;border-color:#d98989}.feedback{margin-top:15px;padding:14px;border-radius:14px;background:#f5f5f7;line-height:1.55}.hidden{display:none!important}
label{display:block;font-size:13px;color:#777;margin:14px 0 6px}input,textarea{width:100%;border:1px solid #ccc;border-radius:12px;padding:12px;font-size:16px;background:#fff}textarea{min-height:90px}.full{width:100%;margin-top:16px}.item{padding:14px 0;border-bottom:1px solid #eee}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.smallbtn{min-height:40px!important;padding:8px 11px!important;font-size:13px!important}.empty{padding:25px 0;text-align:center;color:#777}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand">🇷🇺 露単語クイズ</div><div class="stats"><div class="stat">登録<b id="count">0</b></div><div class="stat">正解率<b id="rate">—</b></div></div></div>
<nav><button class="active" data-tab="quiz">クイズ</button><button data-tab="add">＋追加</button><button data-tab="list">単語一覧</button></nav>

<section class="card page" id="quiz">
<div class="row"><span class="muted">今日の1問</span><span class="muted" id="num">1問目</span></div>
<div id="emptyQuiz" class="empty hidden">まだ単語がありません。<br>「＋追加」から登録しよう。</div>
<div id="quizContent"><div class="word" id="qword"></div><div class="muted">日本語の意味は？</div><div class="choices" id="choices"></div><div class="feedback hidden" id="feedback"></div><button class="btn primary full hidden" id="next">次の問題</button></div>
</section>

<section class="card page hidden" id="add">
<h2>新しい単語・表現</h2>
<label>ロシア語</label><input id="ru" placeholder="например: обязательно">
<label>日本語の意味</label><input id="ja" placeholder="必ず、ぜひ">
<label>例文（任意）</label><textarea id="ex" placeholder="Я обязательно приду."></textarea>
<label>メモ（任意）</label><input id="note" placeholder="使い方、格、ニュアンスなど">
<button class="btn primary full" id="save">＋ 登録する</button><p class="muted" id="saved"></p>
</section>

<section class="card page hidden" id="list">
<div class="row"><h2>単語一覧</h2><span class="muted" id="listCount"></span></div>
<div id="items"></div>
</section>
</div>
<script>
(()=> {
const KEY="ruQuizWordsV1", STAT="ruQuizStatsV1";
let words=JSON.parse(localStorage.getItem(KEY)||"null")||[
{ru:"забыть",ja:"忘れる",ex:"Я забыл его имя.",note:"完了体"},
{ru:"Мне кажется, что…",ja:"〜のように思える",ex:"Мне кажется, что это правильно.",note:"よく使う表現"},
{ru:"обязательно",ja:"必ず、ぜひ",ex:"Я обязательно приду.",note:""},
{ru:"несмотря на",ja:"〜にもかかわらず",ex:"Несмотря на дождь, мы пошли гулять.",note:""}
];
let stats=JSON.parse(localStorage.getItem(STAT)||'{"right":0,"total":0}');
let current=null,locked=false;
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(words));localStorage.setItem(STAT,JSON.stringify(stats));update()}
function update(){$("count").textContent=words.length;$("rate").textContent=stats.total?Math.round(stats.right/stats.total*100)+"%":"—"}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function quiz(){
locked=false;$("feedback").classList.add("hidden");$("next").classList.add("hidden");
if(!words.length){$("quizContent").classList.add("hidden");$("emptyQuiz").classList.remove("hidden");return}
$("quizContent").classList.remove("hidden");$("emptyQuiz").classList.add("hidden");
current=words[Math.floor(Math.random()*words.length)];$("qword").textContent=current.ru;
let opts=shuffle([current.ja,...shuffle(words.filter(w=>w!==current)).slice(0,3).map(w=>w.ja)]);
const fillers=["理解する","決める","避ける","見つける","忘れる","覚えている"].filter(x=>!opts.includes(x));
while(opts.length<4)opts.push(fillers.shift());
opts=shuffle(opts.slice(0,4));$("choices").innerHTML="";
opts.forEach(t=>{let b=document.createElement("button");b.className="btn choice";b.textContent=t;b.onclick=()=>answer(b,t);$("choices").appendChild(b)});
$("num").textContent=(stats.total+1)+"問目";
}
function answer(btn,text){if(locked)return;locked=true;const ok=text===current.ja;stats.total++;if(ok)stats.right++;
document.querySelectorAll("#choices .choice").forEach(b=>{if(b.textContent===current.ja)b.classList.add("ok");else if(b===btn)b.classList.add("no")});
$("feedback").innerHTML=(ok?"✓ 正解！":"✕ 正解は「"+esc(current.ja)+"」")+(current.ex?'<div class="muted" style="margin-top:8px">例文：'+esc(current.ex)+'</div>':'')+(current.note?'<div class="muted">メモ：'+esc(current.note)+'</div>':'');
$("feedback").classList.remove("hidden");$("next").classList.remove("hidden");save()}
$("next").onclick=quiz;
function tab(name){document.querySelectorAll(".page").forEach(p=>p.classList.toggle("hidden",p.id!==name));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));if(name==="quiz")quiz();if(name==="list")render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.tab));
$("save").onclick=()=>{let ru=$("ru").value.trim(),ja=$("ja").value.trim();if(!ru||!ja){$("saved").textContent="ロシア語と意味を入力してね。";return}words.push({ru,ja,ex:$("ex").value.trim(),note:$("note").value.trim()});$("ru").value=$("ja").value=$("ex").value=$("note").value="";$("saved").textContent="登録しました！";save()};
function render(){let box=$("items");$("listCount").textContent=words.length+"語";box.innerHTML=words.length?"":"<div class='empty'>登録した単語がここに表示されます。</div>";words.forEach((w,i)=>{let d=document.createElement("div");d.className="item";d.innerHTML="<div class='row'><strong>"+esc(w.ru)+"</strong><button class='btn smallbtn'>削除</button></div><div>"+esc(w.ja)+"</div>"+(w.note?"<div class='muted'>"+esc(w.note)+"</div>":"")+(w.ex?"<div class='muted'>"+esc(w.ex)+"</div>":"");d.querySelector("button").onclick=()=>{words.splice(i,1);save();render()};box.appendChild(d)})}
update();quiz();
})();
</script>
</body>
</html>
